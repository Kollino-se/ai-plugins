name: Validate restaurant distribution
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.17.0'
      - name: Install pinned validators
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/claude-cli" --no-audit --no-fund @anthropic-ai/claude-code@2.1.283
      - name: Verify bootstrap scripts
        run: |
          python -B -c 'import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("scripts").glob("*.py")]' 
          test "$(python scripts/version.py --bump patch)" = 1.0.0
          test "$(python scripts/version.py --latest v1.2.3 --bump minor)" = 1.3.0
      - name: Reproduce and inspect candidate packages
        if: hashFiles('release-manifest.json') != ''
        run: |
          python scripts/package.py build --root .
          python scripts/package.py validate --root .
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" plugin validate --strict ./claude
          "$RUNNER_TEMP/claude-cli/node_modules/.bin/claude" plugin validate --strict .
